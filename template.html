<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="%%TOTAL%%" data-width="1080" data-height="1920">
  <audio id="a-main" class="clip" data-start="0" data-duration="%%MAIN%%" data-track-index="1" data-volume="1" src="edit.mp4"></audio>
  <audio id="a-bgm" class="clip" data-start="0" data-duration="%%TOTAL%%" data-track-index="2" data-volume="%%BGMVOL%%" src="%%BGM%%"></audio>
  <div id="stage">
    <div id="cam">
      <video id="v-main" class="clip" data-start="0" data-duration="%%MAIN%%" data-track-index="0" src="edit.mp4" muted playsinline></video>
      %%CAM%%
    </div>
    <div id="pip-ring"></div>
    %%BODY%%
    <div id="grain"></div><div id="vig"></div><div id="barT" class="lbox"></div><div id="barB" class="lbox"></div>
  </div>
  <div id="flash"></div>
  %%TOP%%
<script src="gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const CAPS = %%CAPS%%, MAIN = %%MAIN%%, FX = %%FX%%;

// ซับ: คำเด้งทีละคำ + คีย์เวิร์ดสีเหลืองเด้งซ้ำ
CAPS.forEach((t, i) => {
  const ws = document.querySelectorAll("#c" + i + " .w"), end = (CAPS[i + 1] ?? t + 3) - t;
  tl.from(ws, { y: 50, scale: .5, opacity: 0, duration: .2, ease: "back.out(2.6)", stagger: Math.min(.16, end * .55 / Math.max(ws.length, 1)) }, t);
  document.querySelectorAll("#c" + i + " .w b").forEach(b => tl.fromTo(b, { scale: 1 }, { scale: 1.18, duration: .14, yoyo: true, repeat: 1, ease: "power2.out" }, t + .25));
});

// ไลฟ์: ป้าย LIVE กระพริบ + หัวใจลอย
tl.from("#live", { x: -60, opacity: 0, duration: .5, ease: "back.out(1.8)" }, .3);
tl.to("#live .pill i", { opacity: .15, duration: .5, yoyo: true, repeat: Math.floor(MAIN), ease: "steps(1)" }, .3);
document.querySelectorAll("#hearts .ht").forEach((el, i) => {
  const t = .4 + i * .43, dx = ((i * 53) % 120) - 60;
  tl.fromTo(el, { y: 0, x: 0, scale: .4, opacity: 0 }, { y: -560, x: dx, scale: 1.1, opacity: 1, duration: .6, ease: "power1.out" }, t);
  tl.to(el, { y: -760, opacity: 0, duration: .9, ease: "power1.in" }, t + .6);
});

// กล้องย่อเป็นจอเล็กมุมขวาบน (เผยฉากด้านหลัง)
const PIP = { scale: .3, x: 735, y: 96, clipPath: "inset(%%PIPCROP%% round 120px)" };
const FULL = { scale: 1, x: 0, y: 0, clipPath: "inset(0% 0% 0% 0% round 0px)" };
function pipIn(t)  { tl.to("#cam", { ...PIP, duration: .6, ease: "power3.inOut" }, t); tl.fromTo("#pip-ring", { opacity: 0, scale: .8 }, { opacity: 1, scale: 1, duration: .3, ease: "back.out(2)" }, t + .45); }
function pipOut(t) { tl.to("#pip-ring", { opacity: 0, duration: .1 }, t); tl.to("#cam", { ...FULL, duration: .55, ease: "power3.inOut" }, t); }

// ── ฉากต่างๆ (สร้างจาก project.json)
%%JS%%

// ── ปิดท้าย: ชาร์จ → ระเบิด → หน้าร้าน
tl.to("#cam", { scale: 1.16, x: -86.4, y: -140, duration: .6, ease: "power2.in" }, MAIN - .63);
tl.to("#stage", { x: 6, duration: .03, yoyo: true, repeat: 17, ease: "steps(1)" }, MAIN - .58);
tl.fromTo("#ex-core", { scale: .1, opacity: 1 }, { scale: 9, duration: .55, ease: "expo.out" }, MAIN - .03);
tl.to("#ex-core", { opacity: 0, duration: .45, ease: "power2.in" }, MAIN + .47);
tl.fromTo("#ex-ring1", { scale: .2, opacity: 1 }, { scale: 9, opacity: 0, duration: .9, ease: "expo.out" }, MAIN - .03);
tl.fromTo("#ex-ring2", { scale: .2, opacity: .9 }, { scale: 7, opacity: 0, duration: .9, ease: "expo.out" }, MAIN + .07);
document.querySelectorAll("#ex-debris i").forEach((el, i) => {
  const a = i * 2.39996, d = 520 + (i * 137) % 560;
  tl.fromTo(el, { x: 0, y: 0, rotation: 0, opacity: 1 },
    { x: Math.cos(a) * d, y: Math.sin(a) * d + 160, rotation: (i % 2 ? 1 : -1) * (360 + i * 40), opacity: 0, duration: 1.1 + (i % 4) * .05, ease: "expo.out" }, MAIN - .03);
});
tl.from("#outro", { opacity: 0, duration: .2 }, MAIN);
tl.from("#outro img", { scale: 2.4, rotation: -90, opacity: 0, duration: .6, ease: "back.out(1.6)" }, MAIN + .37);
tl.from("#outro .n, #outro .tag", { y: 24, opacity: 0, duration: .4, stagger: .12 }, MAIN + .67);
tl.from("#outro .info", { x: -40, opacity: 0, duration: .4 }, MAIN + 1.07);
tl.from("#outro .box", { y: 60, scale: .85, opacity: 0, duration: .5, ease: "back.out(2)" }, MAIN + 1.37);
tl.to("#outro .box", { scale: 1.05, duration: .35, yoyo: true, repeat: 3, ease: "sine.inOut" }, MAIN + 2.17);

// ── ความมัน: จอสั่น / แฟลช / พุ่งเข้า / เกรนฟิล์ม
function shake(t, a = 26, n = 7) {
  for (let i = 0; i < n; i++) { const k = 1 - i / n, s = i % 2 ? -1 : 1;
    tl.to("#stage", { x: s * a * k, y: -s * a * .6 * k, duration: .035, ease: "none" }, t + i * .035); }
  tl.to("#stage", { x: 0, y: 0, duration: .05, ease: "none" }, t + n * .035);
}
function flash(t, o = .85) { tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: .35, ease: "power2.out" }, t); }
function punch(t, s = 1.1) { tl.fromTo("#stage", { scale: s }, { scale: 1, duration: .45, ease: "expo.out", transformOrigin: "50% 45%" }, t); }
FX.shake.forEach(t => shake(t)); FX.flash.forEach(t => flash(t)); FX.punch.forEach(t => punch(t));
shake(MAIN - .03, 70, 14); flash(MAIN - .03, 1);
tl.fromTo("#grain", { x: 0, y: 0 }, { x: -180, y: 140, duration: MAIN, ease: "steps(500)" }, 0);

window.__timelines["root"] = tl;
</script>
